name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.12 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check lockfile
        run: uv lock --check

      - name: Install base and test dependencies
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run --locked ruff check .

      - name: Run tests
        run: uv run --locked pytest

      - name: Check whitespace
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        run: |
          $base = "${{ github.event.pull_request.base.sha || github.event.before }}"
          if (-not $base) {
            throw "Could not determine the base commit for the whitespace check."
          }
          git diff --check "$base...HEAD"
